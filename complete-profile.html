<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تکمیل پروفایل</title><link rel="stylesheet" href="./theme.css"></head><body class="auth-page"><div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><main class="auth-shell glass"><img class="brand-logo" src="./assets/logo.png"><section><h1>تکمیل پروفایل</h1><p>پیش از ورود به داشبورد، اطلاعات پروفایل را کامل کنید.</p><form id="profileForm" class="form"><label>نام کاربری<input id="nickname" minlength="8" pattern="[A-Za-z0-9_]{8,40}" required></label><label>نام و نام خانوادگی<input id="fullName" required></label><button class="primary">تکمیل ثبت‌نام</button></form></section></main><div id="toastRoot" class="toast-root"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./assets/supabase-config.js"></script><script>
const cfg=window.SUPABASE_CONFIG,sb=window.supabase.createClient(cfg.url,cfg.anonKey);(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href="./";return}const meta=session.user.user_metadata||{};document.querySelector("#nickname").value=(meta.full_name||meta.name||"").replace(/[^A-Za-z0-9_]/g,"").slice(0,40);document.querySelector("#fullName").value=meta.full_name||meta.name||"";})();
document.querySelector("#profileForm").onsubmit=async e=>{e.preventDefault();const n=document.querySelector("#nickname").value.trim(),f=document.querySelector("#fullName").value.trim(),{data:{session}}=await sb.auth.getSession();if(!/^[A-Za-z0-9_]{8,40}$/.test(n)){alert("نام کاربری باید حداقل ۸ کاراکتر و فقط شامل حروف انگلیسی، عدد یا _ باشد.");return}const {data:ex}=await sb.from("acc").select("id").eq("nickname",n).maybeSingle();if(ex&&ex.id!==session.user.id){alert("این نام کاربری قبلاً استفاده شده است.");return}const {error}=await sb.from("acc").upsert({id:session.user.id,nickname:n,full_name:f,email:session.user.email||null,language:"fa",theme:"system"},{onConflict:"id"});if(error){alert(error.message);return}location.href="./dashboard/"};</script></body></html>
